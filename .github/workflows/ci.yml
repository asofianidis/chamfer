name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Chamfer.slnx
      - name: Build
        run: dotnet build Chamfer.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test --solution Chamfer.slnx --no-build --configuration Release
